[project]
name = "rag-evals"
version = "0.1.0"
description = "Golden dataset y evals de RAG (fase 5) para Headache"
requires-python = ">=3.12"
dependencies = [
    "booking-agent",
    "headache-core[retrieval,llamaindex]",
    "orchestrator",
    "pyyaml>=6.0",
    "retrieval",
]

[project.optional-dependencies]
# Jueces LLM de framework (carril C): pesados, solo con `uv sync --all-packages --extra evals`.
evals = [
    "deepeval>=4.2.8",
    "ragas>=0.4.3",
    # ragas 0.4.3 importa langchain_community.chat_models.vertexai, eliminado en 0.4.2
    # (paquete archivado). Quitar el tope cuando ragas deje de importarlo.
    "langchain-community>=0.4.1,<0.4.2",
    "azure-ai-evaluation>=1.18.9",
]
redteam = [
    "pyrit>=1.1.0",
]

[tool.uv.sources]
booking-agent = { workspace = true }
orchestrator = { workspace = true }
headache-core = { workspace = true }
retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_evals"]
