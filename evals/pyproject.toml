[project]
name = "rag-evals"
version = "0.1.0"
description = "Golden dataset y evals de RAG (fase 5) para Headache"
requires-python = ">=3.12"
dependencies = [
    "headache-core[retrieval,llamaindex]",
    "retrieval",
]

[tool.uv.sources]
headache-core = { workspace = true }
retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_evals"]
