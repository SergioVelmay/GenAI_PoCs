name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Acciones fijadas por SHA de commit (un tag se puede mover; un SHA no): defensa ante ataques a la
# cadena de suministro. Dependabot (.github/dependabot.yml) propone las subidas.
# Runner fijado (ubuntu-26.04) en lugar de ubuntu-latest: la imagen cambia solo cuando lo decidimos.

env:
  # NLTK (pathsec) rechaza ficheros con st_nlink > 1; uv en Linux instala con hardlinks a su caché.
  UV_LINK_MODE: copy

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Instalar dependencias (lockfile obligatorio)
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      # Fase 12.6: un prompt no cambia sin subir su versión (prompts.lock.json).
      - name: Candado de prompts versionados
        run: uv run python -m rag_evals.llmops.prompts check

      - name: Generador de datos sintéticos (smoke test)
        run: uv run python scripts/generate_synthetic_data.py --scale small --out /tmp/synthetic

      - name: Informe de chunking (smoke test)
        run: uv run python scripts/chunking_report.py --source /tmp/synthetic/knowledge/documents.jsonl

      # Fase 11.6: reglas de SLO y coste generadas al día, válidas y con sus tests.
      - name: Dashboard y reglas de alerta al día
        run: uv run python scripts/build_observability.py --check

      - name: Reglas de alerta (promtool check + test)
        run: |
          docker run --rm -v "$PWD/infra/local/telemetry/rules:/rules:ro" \
            --entrypoint promtool prom/prometheus:v3.15.1 check rules /rules/headache.rules.yml
          docker run --rm -v "$PWD/infra/local/telemetry/rules:/rules:ro" \
            --entrypoint promtool prom/prometheus:v3.15.1 test rules /rules/tests/headache.test.yml

      # Fase 11.7: el collector local y los de Azure y AWS arrancan con su configuración (sin enviar
      # nada). Credenciales ficticias: sigv4auth solo las resuelve, no firma.
      - name: Configuración del collector (local, Azure, AWS)
        run: |
          image=otel/opentelemetry-collector-contrib:0.163.1
          docker run --rm -v "$PWD/infra/local/telemetry:/cfg:ro" "$image" \
            validate --config=/cfg/otel-collector.yaml
          docker run --rm -v "$PWD/infra/otel:/cfg:ro" \
            -e APPLICATIONINSIGHTS_CONNECTION_STRING="InstrumentationKey=00000000-0000-0000-0000-000000000000" \
            "$image" validate --config=/cfg/collector-azure.yaml
          docker run --rm -v "$PWD/infra/otel:/cfg:ro" \
            -e AWS_REGION=eu-west-1 -e ENVIRONMENT=ci -e AWS_ACCESS_KEY_ID=dummy -e AWS_SECRET_ACCESS_KEY=dummy \
            "$image" validate --config=/cfg/collector-aws.yaml

  evals:
    # Evals deterministas (coste 0) contra el baseline versionado. Los jueces LLM no corren aquí.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Instalar dependencias (lockfile obligatorio)
        run: uv sync --all-packages --locked

      - name: Golden dataset coherente con el corpus
        run: uv run python -m rag_evals.golden --check

      - name: Evals de retrieval (B y C, todas las estrategias)
        run: uv run python -m rag_evals.retrieval_eval --out /tmp/evals

      - name: Evals de generación (extractivo)
        run: >-
          uv run python -m rag_evals.generation_eval --out /tmp/evals
          --strategy hybrid --strategy bm25 --strategy parent-child

      # enforce: bloquean los invariantes (ACL, citas) y las regresiones de más de 0,01 respecto
      # al baseline. Activado en el checkpoint 8→9 tras 15 ejecuciones seguidas con 0 regresiones.
      - name: Gate contra el baseline
        run: uv run python -m rag_evals.gate --reports /tmp/evals --mode enforce

      # Bloquea siempre (fase 12.1): trayectoria, parámetros, resolución e invariantes de los 7
      # sabores; solo se aceptan los huecos conocidos de evals/baselines/agent-scenarios-v1.json.
      - name: Evals de agentes (7 sabores, trayectoria y resolución)
        run: uv run python -m rag_evals.agents --out /tmp/evals --check

      # Bloquea siempre: un ataque no contenido o un falso positivo es un fallo de seguridad.
      - name: Tests de ataque del harness (7 sabores, modelo comprometido)
        run: uv run python -m rag_evals.attacks --out /tmp/evals --check
      # Bloquea siempre (fase 12.4): los ataques mutados por PyRIT (dataset congelado, sin
      # instalar PyRIT) solo pueden dejar el riesgo residual de attack-mutations-v1.json.
      - name: Red teaming offline (mutaciones de PyRIT)
        run: uv run python -m rag_evals.redteam.mutations --out /tmp/evals --check
      # Bloquea siempre (fase 12.5): variantes congeladas de promptfoo (tests.yaml) contra el
      # provider Python; aserciones en JavaScript, sin generación remota, telemetría ni claves.
      - name: Red teaming con promptfoo (estrategias locales)
        run: |
          node --version
          uv run python -m rag_evals.redteam.promptfoo eval --out /tmp/evals --check
      - name: Informe de red teaming consolidado
        run: uv run python -m rag_evals.redteam.report --reports /tmp/evals
      # Bloquea siempre: invariantes multi-agente (nada irreversible sin una persona, identidad
      # fuera del LLM, contexto mínimo en el traspaso) en LangGraph, MAF y la cola.
      - name: Evals multi-agente (3 motores, modelo guionizado)
        run: uv run python -m rag_evals.multiagent --out /tmp/evals --check
      # Bloquea siempre: un falso acierto es una respuesta equivocada servida con confianza.
      - name: Calibración de la caché semántica (falsos aciertos y personales = 0)
        run: uv run python -m rag_evals.semantic_cache --out /tmp/evals --check
      # Bloquea siempre (fase 12.8): el detector de drift ve los cambios conocidos (ola de
      # cancelaciones, regresión silenciosa) y no grita en una semana normal ni con poca muestra.
      - name: Detector de drift (escenarios sintéticos)
        run: uv run python -m rag_evals.llmops.drift --output /tmp/evals/drift.md --check

      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reports
          path: /tmp/evals/
          if-no-files-found: ignore

  mcp-image:
    # Los servidores MCP se despliegan como contenedores: la imagen debe construir y arrancar.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f services/mcp_servers/Dockerfile -t headache-mcp:ci .
      - name: Smoke test (health de catalog)
        run: |
          docker run -d --name mcp -p 127.0.0.1:8101:8101 headache-mcp:ci catalog
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8101/health && exit 0; sleep 1; done
          docker logs mcp; exit 1

  agents-image:
    # Especialistas A2A (fase 9.5): la imagen construye, arranca y exige token. Sin LLM ni coste.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f services/orchestrator/Dockerfile -t headache-agents:ci .
      - name: Smoke test (Agent Card, 401 sin token y 200 con token del orquestador)
        run: |
          mkdir -p /tmp/keys && chmod 777 /tmp/keys
          token=$(docker run --rm -v /tmp/keys:/keys --entrypoint python headache-agents:ci -c \
            "from pathlib import Path; from headache_mcp.auth import DevTokenIssuer; from headache_core.config import A2ASettings as S; s=S(); print(DevTokenIssuer.load_or_create(Path('/keys/dev.pem'), issuer=s.issuer).mint(subject=s.caller_id, audience=s.audience('creative'), scopes=[s.scope]))")
          docker run -d --name agent -p 127.0.0.1:8202:8000 -v /tmp/keys:/keys:ro \
            -e A2A__PUBLIC_KEY_FILE=/keys/dev.pub -e AZURE_OPENAI__ENDPOINT=https://llm.invalid \
            headache-agents:ci creative --public-url http://127.0.0.1:8202
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8202/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8202/.well-known/agent-card.json | grep -q headache-creative-specialist
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8202/a2a -d '{}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8202/a2a \
            -H "Authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"GetTask","params":{"id":"x"}}')" = 200 \
            || { docker logs agent; exit 1; }

  terraform:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        module: [aws, azure, gcp]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      # Sin credenciales ni backend: solo sintaxis, tipos y referencias. El plan llega con OIDC.
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  integration:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: headache
          POSTGRES_PASSWORD: headache-ci
          POSTGRES_DB: headache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U headache -d headache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        # Con la API de gestión: el autoescalador lee la profundidad de las colas (fase 10.6).
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: headache
          RABBITMQ_DEFAULT_PASS: headache-ci
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
      # SQS emulado; el test de contrato crea sus colas. Service Bus se salta en CI
      # (su emulador exige aceptar una EULA y ~2 GB de RAM con SQL Server).
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
      # Rate limiting distribuido (fase 10). Los services no admiten `command`: sin contraseña.
      redis-scale:
        image: redis:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES__PASSWORD: headache-ci
      RABBITMQ__PASSWORD: headache-ci
      SQS__ENDPOINT_URL: http://127.0.0.1:9324
      PUBSUB__EMULATOR_HOST: 127.0.0.1:8085
      # Misma imagen que el perfil `pubsub` de docker-compose.yml.
      PUBSUB_IMAGE: gcr.io/google.com/cloudsdktool/google-cloud-cli:593.0.0-emulators
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pub/Sub emulado (fase 0.G3). Los services no admiten `command` y el emulador lo necesita
      # (--host-port=0.0.0.0: por defecto escucha en el localhost del contenedor, inalcanzable desde
      # el puerto publicado). La imagen pesa ~1,7 GB: se descarga y
      # arranca en segundo plano mientras se instalan dependencias y se migra la base de datos.
      - name: Arrancar el emulador de Pub/Sub (en segundo plano)
        run: |
          nohup docker run -d --name pubsub -p 127.0.0.1:8085:8085 "$PUBSUB_IMAGE" \
            gcloud beta emulators pubsub start --project=headache-local --host-port=0.0.0.0:8085 \
            > /tmp/pubsub-start.log 2>&1 &

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Instalar dependencias (lockfile obligatorio)
        run: uv sync --all-packages --locked

      - name: Migraciones (subida, bajada y subida)
        run: |
          uv run alembic -c packages/headache_core/alembic.ini upgrade head
          uv run alembic -c packages/headache_core/alembic.ini downgrade base
          uv run alembic -c packages/headache_core/alembic.ini upgrade head

      - name: El modelo ORM coincide con las migraciones
        run: uv run alembic -c packages/headache_core/alembic.ini check

      - name: Esperar al emulador de Pub/Sub
        run: |
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8085 && exit 0; sleep 2; done
          cat /tmp/pubsub-start.log; docker logs pubsub || true; exit 1

      - name: Tests de integración (concurrencia, bloqueos, idempotencia)
        run: uv run pytest -m integration

      - name: Carga masiva y benchmark (smoke test)
        run: |
          uv run python scripts/generate_synthetic_data.py --scale small
          uv run python scripts/load_seed.py --truncate
          uv run python scripts/sql_benchmark.py --repeat 1

  release-gate:
    # Gate obligatorio de despliegue (fase 12.1): un único check que resume todos los demás. Los
    # workflows de despliegue (fases 13 y 14) dependerán de él, no de cada job por separado.
    if: always()
    needs: [quality, evals, mcp-image, agents-image, terraform, integration]
    runs-on: ubuntu-26.04
    steps:
      - name: Todos los jobs en verde
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::Gate de despliegue: algún job no está en verde"; exit 1; }
          done
