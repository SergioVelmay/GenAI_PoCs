name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias (lockfile obligatorio)
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Generador de datos sintéticos (smoke test)
        run: uv run python scripts/generate_synthetic_data.py --scale small --out /tmp/synthetic
