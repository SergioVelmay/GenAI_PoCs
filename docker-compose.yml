# Entorno local. Núcleo:            docker compose up -d
#                Con observabilidad: docker compose --profile observability up -d
#                Emuladores de colas: --profile sqs (ElasticMQ) | --profile servicebus
#                Servidores MCP:     --profile mcp (necesitan ticketing_api en el host :8000)
#                Especialistas A2A:  --profile agents (ídem; coste al recibir casos)
name: genai-pocs

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://${POSTGRES__USER}:${POSTGRES__PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  # ---------- Núcleo ----------
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES_DB: ${POSTGRES__DATABASE}
    ports:
      - "127.0.0.1:${POSTGRES__PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER} -d ${POSTGRES__DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ__PORT}:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------- Emuladores de colas cloud (fase 3) ----------
  # SQS: ElasticMQ (Apache-2.0, sin cuenta). Colas + DLQ declaradas en elasticmq.conf.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    profiles: [sqs]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9324:9324"
      - "127.0.0.1:9325:9325"
    volumes:
      - ./infra/local/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  # Service Bus: emulador oficial (EULA propia) + SQL Server como almacenamiento.
  # Pon SERVICEBUS_ACCEPT_EULA=Y en .env solo si aceptas ambas licencias.
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    profiles: [servicebus]
    depends_on: [mssql]
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: ${SERVICEBUS_ACCEPT_EULA:-N}
    ports:
      # 5673 en el host: el 5672 ya lo usa RabbitMQ.
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:5300:5300"
    volumes:
      - ./infra/local/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [servicebus]
    environment:
      ACCEPT_EULA: ${SERVICEBUS_ACCEPT_EULA:-N}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

  # ---------- Escala (fase 10): rate limiting y caché semántica ----------
  # Redis 8 propio (el de Langfuse es suyo). Sin persistencia: todo lo que guarda caduca.
  redis-scale:
    image: redis:8
    profiles: [scale]
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${SCALE_REDIS__PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "127.0.0.1:${SCALE_REDIS__PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SCALE_REDIS__PASSWORD}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Worker sintético de la demo de autoescalado (fase 10.6): sin LLM ni coste. Arranca con 0
  # réplicas; las mueve scripts/queue_autoscaler.py según la cola demo.jobs (como KEDA).
  queue-worker:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: headache-agents:local
    profiles: [scale]
    restart: unless-stopped
    entrypoint: ["python", "-m", "orchestrator.load_worker"]
    command: ["--service-ms", "1000", "--prefetch", "4"]
    deploy:
      replicas: 0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ__HOST: rabbitmq
      RABBITMQ__USER: ${RABBITMQ__USER}
      RABBITMQ__PASSWORD: ${RABBITMQ__PASSWORD}

  # ---------- Servidores MCP (fase 6): una imagen, tres contenedores ----------
  mcp-catalog: &mcp
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    image: headache-mcp:local
    profiles: [mcp]
    restart: unless-stopped
    command: ["catalog"]
    environment:
      # Configurable por si el 8000 del host está ocupado: MCP_TICKETING_API_URL=http://host.docker.internal:8010
      TICKETING_API__BASE_URL: ${MCP_TICKETING_API_URL:-http://host.docker.internal:8000}
      ENVIRONMENT: local
      # jwt: tokens del emisor de desarrollo (python -m headache_mcp.auth). none: identidad fija.
      MCP__AUTH: ${MCP__AUTH:-none}
      MCP__PUBLIC_KEY_FILE: /run/secrets/headache/mcp-dev-key.pub
      MCP__DEV_CUSTOMER_ID: ${MCP__DEV_CUSTOMER_ID:-}
    volumes:
      - ./.secrets:/run/secrets/headache:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8101:8101"

  mcp-ticketing:
    <<: *mcp
    command: ["ticketing"]
    ports:
      - "127.0.0.1:8102:8102"

  mcp-refunds:
    <<: *mcp
    command: ["refunds"]
    ports:
      - "127.0.0.1:8103:8103"

  # Gateway propio (carril B): exige MCP__AUTH=jwt en los tres servidores.
  mcp-gateway:
    <<: *mcp
    command: ["gateway"]
    environment:
      ENVIRONMENT: local
      MCP__AUTH: jwt
      MCP__PUBLIC_KEY_FILE: /run/secrets/headache/mcp-dev-key.pub
      # Solo local: el gateway hace de STS con la clave de desarrollo.
      MCP__DEV_PRIVATE_KEY_FILE: /run/secrets/headache/mcp-dev-key.pem
      MCP__PUBLIC_URL_TEMPLATE: http://127.0.0.1:{port}
      MCP__SERVERS: >-
        {"catalog": "http://mcp-catalog:8101/mcp", "ticketing": "http://mcp-ticketing:8102/mcp",
        "refunds": "http://mcp-refunds:8103/mcp"}
    ports:
      - "127.0.0.1:8100:8100"

  # ---------- Especialistas A2A (fase 9.5): una imagen, un contenedor por subagente ----------
  # Llaman al LLM al recibir casos (coste). Azure OpenAI dentro del contenedor necesita
  # AZURE_OPENAI__API_KEY (no hay `az login`); sin clave, ejecútalos en el host con
  # `uv run python -m orchestrator.serve <especialista> --port 820X`.
  agent-refunds: &agent
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: headache-agents:local
    profiles: [agents]
    restart: unless-stopped
    command: ["refunds", "--public-url", "http://127.0.0.1:8201"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: local
      POSTGRES__HOST: postgres
      TICKETING_API__BASE_URL: ${AGENTS_TICKETING_API_URL:-http://host.docker.internal:8000}
      A2A__PUBLIC_KEY_FILE: /run/secrets/headache/mcp-dev-key.pub
      RETRIEVAL__DOCUMENTS_PATH: /app/data/synthetic/knowledge/documents.jsonl
    volumes:
      - ./.secrets:/run/secrets/headache:ro
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8201:8000"

  agent-creative:
    <<: *agent
    command: ["creative", "--public-url", "http://127.0.0.1:8202"]
    ports:
      - "127.0.0.1:8202:8000"

  agent-knowledge:
    <<: *agent
    command: ["knowledge", "--public-url", "http://127.0.0.1:8203"]
    ports:
      - "127.0.0.1:8203:8000"

  # ---------- Observabilidad (Langfuse v3) ----------
  langfuse-web:
    image: langfuse/langfuse:3
    profiles: [observability]
    restart: unless-stopped
    depends_on: &langfuse-deps
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: headache
      LANGFUSE_INIT_ORG_NAME: Headache
      LANGFUSE_INIT_PROJECT_ID: genai-pocs
      LANGFUSE_INIT_PROJECT_NAME: GenAI PoCs
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE__PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE__SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    profiles: [observability]
    restart: unless-stopped
    depends_on: *langfuse-deps
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      <<: *langfuse-env

  clickhouse:
    image: clickhouse/clickhouse-server
    profiles: [observability]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7
    profiles: [observability]
    restart: unless-stopped
    command: ["--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    profiles: [observability]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

volumes:
  postgres-data:
  rabbitmq-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
