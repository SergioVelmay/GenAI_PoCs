# Prometheus local (fase 11.5): lee las métricas que el collector expone en :8889.
# Las reglas de SLO y de coste (fase 11.6) se cargan desde rules/.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
