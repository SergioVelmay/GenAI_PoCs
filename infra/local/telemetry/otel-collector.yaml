# Collector de OpenTelemetry local (fase 11.5): la pieza común entre local, Azure y AWS.
#
#   servicios ──OTLP/HTTP :4318──▶ collector ──▶ Jaeger (trazas, sin contenido)
#                                            └──▶ Prometheus (métricas, scrape de :8889)
#
# En la nube se cambia este fichero, no el código: Azure Monitor (exporter `azuremonitor`) y
# AWS (ADOT con `awsxray` y `awsemf`). El reenvío a Langfuse va en
# `otel-collector.langfuse.yaml`, que se fusiona encima con un segundo `--config`.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protege la memoria del collector: si el backend va lento, rechaza en vez de caerse.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 2s
  # Los backends genéricos no reciben prompts ni respuestas aunque un servicio los capture:
  # ese contenido solo va a Langfuse, que tiene su control de acceso por proyecto.
  attributes/no-content:
    actions:
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.tool.call.arguments, action: delete}
      - {key: gen_ai.tool.call.result, action: delete}
      - {key: langfuse.observation.input, action: delete}
      - {key: langfuse.observation.output, action: delete}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Explícito: los nombres que genera `adapters/prometheus.py` dependen de esta traducción
    # (puntos a `_`, sufijo de unidad y `_total` en los contadores).
    translation_strategy: UnderscoreEscapingWithSuffixes
    # Servicio y entorno como etiquetas para filtrar. NO el id de instancia: cambia en cada
    # arranque y crearía series nuevas en cada despliegue (cardinalidad). Las trazas sí lo
    # conservan, para saber qué réplica falló.
    resource_constant_labels:
      included: [service.name, deployment.environment.name]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/no-content, batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
