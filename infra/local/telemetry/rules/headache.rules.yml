  - record: slo:error_ratio:rate3d
    expr: ((sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[3d]))
      - sum(rate(headache_answer_time_to_first_chunk_seconds_bucket{headache_cache_outcome!="hit",le="1.5"}[3d])))
      or vector(0)) / clamp_min(sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[3d])),
      1e-9)
    labels:
      slo: assistant-ttft
  - record: slo:error_ratio:rate5m
    expr: (sum(rate(headache_admission_decisions_total{headache_caller_plan="public",headache_admission_outcome="shed"}[5m]))
      or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_caller_plan="public"}[5m])),
      1e-9)
    labels:
      slo: public-admission
  - record: slo:error_ratio:rate30m
    expr: (sum(rate(headache_admission_decisions_total{headache_caller_plan="public",headache_admission_outcome="shed"}[30m]))
      or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_caller_plan="public"}[30m])),
      1e-9)
    labels:
      slo: public-admission
  - record: slo:error_ratio:rate1h
    expr: (sum(rate(headache_admission_decisions_total{headache_caller_plan="public",headache_admission_outcome="shed"}[1h]))
      or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_caller_plan="public"}[1h])),
      1e-9)
    labels:
