# GENERADO por scripts/build_observability.py desde domain/slo.py y metrics.CATALOG.
# No editar a mano. Tests: rules/tests (promtool test rules).
groups:
- name: slo-sli
  interval: 30s
  rules:
  - record: slo:error_ratio:rate5m
    expr: (clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[5m])) - sum(rate(headache_answers_total[5m])),
      0) or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[5m])),
      1e-9)
    labels:
      slo: assistant-availability
  - record: slo:error_ratio:rate30m
    expr: (clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[30m])) - sum(rate(headache_answers_total[30m])),
      0) or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[30m])),
      1e-9)
    labels:
      slo: assistant-availability
  - record: slo:error_ratio:rate1h
    expr: (clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[1h])) - sum(rate(headache_answers_total[1h])),
      0) or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[1h])),
      1e-9)
    labels:
      slo: assistant-availability
  - record: slo:error_ratio:rate2h
    expr: (clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[2h])) - sum(rate(headache_answers_total[2h])),
      0) or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[2h])),
      1e-9)
    labels:
      slo: assistant-availability
  - record: slo:error_ratio:rate6h
    expr: (clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[6h])) - sum(rate(headache_answers_total[6h])),
      0) or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[6h])),
      1e-9)
    labels:
      slo: assistant-availability
  - record: slo:error_ratio:rate1d
    expr: (clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[1d])) - sum(rate(headache_answers_total[1d])),
      0) or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[1d])),
      1e-9)
    labels:
      slo: assistant-availability
  - record: slo:error_ratio:rate3d
    expr: (clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[3d])) - sum(rate(headache_answers_total[3d])),
      0) or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_route="ask"}[3d])),
      1e-9)
    labels:
      slo: assistant-availability
  - record: slo:error_ratio:rate5m
    expr: ((sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[5m]))
      - sum(rate(headache_answer_time_to_first_chunk_seconds_bucket{headache_cache_outcome!="hit",le="1.5"}[5m])))
      or vector(0)) / clamp_min(sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[5m])),
      1e-9)
    labels:
      slo: assistant-ttft
  - record: slo:error_ratio:rate30m
    expr: ((sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[30m]))
      - sum(rate(headache_answer_time_to_first_chunk_seconds_bucket{headache_cache_outcome!="hit",le="1.5"}[30m])))
      or vector(0)) / clamp_min(sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[30m])),
      1e-9)
    labels:
      slo: assistant-ttft
  - record: slo:error_ratio:rate1h
    expr: ((sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[1h]))
      - sum(rate(headache_answer_time_to_first_chunk_seconds_bucket{headache_cache_outcome!="hit",le="1.5"}[1h])))
      or vector(0)) / clamp_min(sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[1h])),
      1e-9)
    labels:
      slo: assistant-ttft
  - record: slo:error_ratio:rate2h
    expr: ((sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[2h]))
      - sum(rate(headache_answer_time_to_first_chunk_seconds_bucket{headache_cache_outcome!="hit",le="1.5"}[2h])))
      or vector(0)) / clamp_min(sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[2h])),
      1e-9)
    labels:
      slo: assistant-ttft
  - record: slo:error_ratio:rate6h
    expr: ((sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[6h]))
      - sum(rate(headache_answer_time_to_first_chunk_seconds_bucket{headache_cache_outcome!="hit",le="1.5"}[6h])))
      or vector(0)) / clamp_min(sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[6h])),
      1e-9)
    labels:
      slo: assistant-ttft
  - record: slo:error_ratio:rate1d
    expr: ((sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[1d]))
      - sum(rate(headache_answer_time_to_first_chunk_seconds_bucket{headache_cache_outcome!="hit",le="1.5"}[1d])))
      or vector(0)) / clamp_min(sum(rate(headache_answer_time_to_first_chunk_seconds_count{headache_cache_outcome!="hit"}[1d])),
      1e-9)
    labels:
