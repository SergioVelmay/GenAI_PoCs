        429 por abuso no cuenta: es la política funcionando. Objetivo 99.5% en 28 días. Error en 1d: {{
        $value | humanizePercentage }}.'
      runbook_url: docs/runbook-incidentes.md#assistant-availability
  - alert: ErrorBudgetBurn
    expr: slo:error_ratio:rate3d{slo="assistant-availability"} > 0.005 and slo:error_ratio:rate6h{slo="assistant-availability"}
      > 0.005
    for: 15m
