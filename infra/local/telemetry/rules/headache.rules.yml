  - record: slo:error_ratio:rate5m
    expr: (sum(rate(messaging_process_duration_seconds_count{error_type!="",error_type!="CancelledError"}[5m]))
      or vector(0)) / clamp_min(sum(rate(messaging_process_duration_seconds_count[5m])), 1e-9)
    labels:
      slo: case-processing
  - record: slo:error_ratio:rate30m
    expr: (sum(rate(messaging_process_duration_seconds_count{error_type!="",error_type!="CancelledError"}[30m]))
