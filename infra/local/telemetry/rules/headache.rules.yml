    labels:
      slo: llm-calls
  - record: slo:error_ratio:rate6h
    expr: ((sum(rate(gen_ai_client_operation_duration_seconds_count{error_type!="",error_type!="CancelledError"}[6h]))
      or vector(0)) + (sum(rate(headache_llm_rejections_total[6h])) or vector(0)) or vector(0)) / clamp_min(sum(rate(gen_ai_client_operation_duration_seconds_count[6h]))
      + (sum(rate(headache_llm_rejections_total[6h])) or vector(0)), 1e-9)
    labels:
