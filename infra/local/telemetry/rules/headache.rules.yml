- name: operacion
  rules:
  - alert: LlmCostBudget
    expr: 86400 * sum(rate(headache_llm_cost_USD_total[1h])) > 16
    for: 15m
    labels:
      severity: ticket
      owner: finops
    annotations:
      summary: El gasto en modelos va camino de pasar el presupuesto diario
      description: Al ritmo de la última hora se gastarían {{ $value | printf "%.2f" }} $ al día (presupuesto
        20 $, aviso al 80%).
      runbook_url: docs/runbook-incidentes.md#coste
  - alert: LlmCostRunaway
    expr: 86400 * sum(rate(headache_llm_cost_USD_total[15m])) > 60
    for: 5m
    labels:
      severity: page
      owner: plataforma-ia
    annotations:
      summary: Gasto en modelos disparado (posible bucle de agente o abuso)
      description: En los últimos 15 min se gasta a un ritmo de {{ $value | printf "%.2f" }} $/día, el
        triple del presupuesto.
      runbook_url: docs/runbook-incidentes.md#coste
  - alert: OutboxBacklogGrowing
    expr: sum(headache_outbox_backlog) > 100
    for: 10m
    labels:
      severity: page
      owner: soporte-ia
    annotations:
      summary: 'Eventos atascados en el outbox: los casos no avanzan'
      description: '{{ $value }} eventos sin publicar desde hace 10 min.'
      runbook_url: docs/runbook-incidentes.md#outbox
  - alert: FaithfulnessDrop
    expr: (sum(rate(headache_eval_faithfulness_sum[1h])) or vector(0)) / clamp_min(sum(rate(headache_eval_faithfulness_count[1h])),
      1e-9) < 0.8 and sum(increase(headache_eval_faithfulness_count[1h])) >= 20
    for: 15m
    labels:
      severity: ticket
      owner: plataforma-ia
    annotations:
      summary: Las respuestas se apoyan menos en las fuentes (evaluación online)
      description: 'Faithfulness media de la última hora: {{ $value | humanizePercentage }} (umbral 80
        %, mínimo 20 muestras).'
      runbook_url: docs/runbook-incidentes.md#faithfulness
  - alert: PromptInjectionSpike
    expr: sum(rate(headache_guardrail_triggers_total{headache_guardrail_code=~"prompt_injection|indirect_injection"}[10m]))
      > 0.05
    for: 10m
    labels:
      severity: ticket
      owner: seguridad
    annotations:
      summary: Pico de intentos de inyección bloqueados por el harness
      description: '{{ $value | humanize }} bloqueos/s en 10 min.'
      runbook_url: docs/runbook-incidentes.md#inyeccion
