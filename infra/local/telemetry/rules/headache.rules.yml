- name: slo-burn-rate
  rules:
  - alert: ErrorBudgetBurn
    expr: slo:error_ratio:rate1h{slo="assistant-availability"} > 0.072 and slo:error_ratio:rate5m{slo="assistant-availability"}
      > 0.072
    for: 2m
    labels:
      severity: page
      slo: assistant-availability
      owner: plataforma-ia
      window: 1h
    annotations:
      summary: 'assistant-availability: presupuesto de error quemándose a 14.4x'
      description: 'Preguntas al asistente respondidas sin error del servidor (5xx o stream roto). Un
        429 por abuso no cuenta: es la política funcionando. Objetivo 99.5% en 28 días. Error en 1h: {{
        $value | humanizePercentage }}.'
      runbook_url: docs/runbook-incidentes.md#assistant-availability
  - alert: ErrorBudgetBurn
    expr: slo:error_ratio:rate6h{slo="assistant-availability"} > 0.03 and slo:error_ratio:rate30m{slo="assistant-availability"}
      > 0.03
    for: 2m
    labels:
      severity: page
      slo: assistant-availability
      owner: plataforma-ia
      window: 6h
    annotations:
      summary: 'assistant-availability: presupuesto de error quemándose a 6x'
      description: 'Preguntas al asistente respondidas sin error del servidor (5xx o stream roto). Un
        429 por abuso no cuenta: es la política funcionando. Objetivo 99.5% en 28 días. Error en 6h: {{
        $value | humanizePercentage }}.'
      runbook_url: docs/runbook-incidentes.md#assistant-availability
  - alert: ErrorBudgetBurn
    expr: slo:error_ratio:rate1d{slo="assistant-availability"} > 0.015 and slo:error_ratio:rate2h{slo="assistant-availability"}
      > 0.015
    for: 15m
