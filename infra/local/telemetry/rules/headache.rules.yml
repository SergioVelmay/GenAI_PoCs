  - record: slo:error_ratio:rate3d
    expr: (sum(rate(messaging_process_duration_seconds_count{error_type!="",error_type!="CancelledError"}[3d]))
      or vector(0)) / clamp_min(sum(rate(messaging_process_duration_seconds_count[3d])), 1e-9)
    labels:
      slo: case-processing
  - record: slo:error_ratio:rate5m
    expr: ((sum(rate(gen_ai_client_operation_duration_seconds_count{error_type!="",error_type!="CancelledError"}[5m]))
      or vector(0)) + (sum(rate(headache_llm_rejections_total[5m])) or vector(0)) or vector(0)) / clamp_min(sum(rate(gen_ai_client_operation_duration_seconds_count[5m]))
      + (sum(rate(headache_llm_rejections_total[5m])) or vector(0)), 1e-9)
    labels:
      slo: llm-calls
  - record: slo:error_ratio:rate30m
    expr: ((sum(rate(gen_ai_client_operation_duration_seconds_count{error_type!="",error_type!="CancelledError"}[30m]))
