      1e-9)
    labels:
      slo: public-admission
  - record: slo:error_ratio:rate6h
    expr: (sum(rate(headache_admission_decisions_total{headache_caller_plan="public",headache_admission_outcome="shed"}[6h]))
      or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_caller_plan="public"}[6h])),
      1e-9)
    labels:
      slo: public-admission
  - record: slo:error_ratio:rate1d
    expr: (sum(rate(headache_admission_decisions_total{headache_caller_plan="public",headache_admission_outcome="shed"}[1d]))
      or vector(0)) / clamp_min(sum(rate(headache_admission_decisions_total{headache_caller_plan="public"}[1d])),
      1e-9)
    labels:
      slo: public-admission
  - record: slo:error_ratio:rate3d
    expr: (sum(rate(headache_admission_decisions_total{headache_caller_plan="public",headache_admission_outcome="shed"}[3d]))
