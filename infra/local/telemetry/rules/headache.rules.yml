  - record: slo:error_ratio:rate1h
    expr: (sum(rate(messaging_process_duration_seconds_count{error_type!="",error_type!="CancelledError"}[1h]))
      or vector(0)) / clamp_min(sum(rate(messaging_process_duration_seconds_count[1h])), 1e-9)
