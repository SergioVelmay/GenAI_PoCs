  - record: slo:error_ratio:rate1d
    expr: (sum(rate(messaging_process_duration_seconds_count{error_type!="",error_type!="CancelledError"}[1d]))
      or vector(0)) / clamp_min(sum(rate(messaging_process_duration_seconds_count[1d])), 1e-9)
    labels:
