include classpath("application.conf")

# URL de las colas tal como la ve el cliente desde el host.
node-address {
  protocol = http
  host = "127.0.0.1"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = eu-west-1
  accountId = 000000000000
}

# Equivale a lo que en AWS declara Terraform: cola + DLQ con redrive (maxReceiveCount).
# Los nombres de SQS no admiten puntos: el topic `knowledge.documents` -> `knowledge-documents`.
queues {
  knowledge-documents {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "knowledge-documents-dlq"
      maxReceiveCount = 5
    }
  }
  knowledge-documents-dlq { }
}
