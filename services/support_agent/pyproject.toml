[project]
name = "support-agent"
version = "0.1.0"
description = "Agente mínimo de atención al cliente (carril B): bucle propio + tools por MCP"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "headache-core[azure,aws,gateway,observability,tools]",
    # Solo por el emisor de tokens de desarrollo y los scopes de cada servidor.
    "mcp-servers",
]

[tool.uv.sources]
headache-core = { workspace = true }
mcp-servers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]
