[project]
name = "ticketing-api"
version = "0.1.0"
description = "API de ticketing de Headache: catálogo, disponibilidad, compra y reembolsos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "headache-core[postgres]",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
headache-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketing_api"]
