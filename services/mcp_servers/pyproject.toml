[project]
name = "mcp-servers"
version = "0.1.0"
description = "Servidores MCP de Headache (catalog, ticketing, refunds) sobre la API de ticketing"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "headache-core[tools]",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
headache-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headache_mcp"]
