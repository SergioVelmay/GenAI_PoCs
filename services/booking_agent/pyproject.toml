[project]
name = "booking-agent"
version = "0.1.0"
description = "Knowledge & Booking Agent (fase 7): el mismo agente en cinco sabores de framework"
requires-python = ">=3.12"
dependencies = [
    "headache-core[azure,aws,gateway,observability,retrieval,tools]",
    "retrieval",
    "support-agent",
    # Sabores de framework (fase 7.2 y 7.3).
    "agent-framework-core>=1.21,<2",
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    "llama-index-core>=0.14,<0.15",
    "strands-agents>=1.59,<2",
]

[tool.uv.sources]
headache-core = { workspace = true }
retrieval = { workspace = true }
support-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_agent"]
