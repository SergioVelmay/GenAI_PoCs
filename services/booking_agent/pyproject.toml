[project]
name = "booking-agent"
version = "0.1.0"
description = "Knowledge & Booking Agent (fase 7): el mismo agente en cinco sabores de framework"
requires-python = ">=3.12"
dependencies = [
    "headache-core[aws,azure,gateway,observability,retrieval,telemetry,tools]",
    "harness",
    "retrieval",
    "support-agent",
    # Sabores de framework (fase 7.2 y 7.3).
    "agent-framework-core>=1.21,<2",
    "fastapi>=0.115",
    # ADK es el sabor de la fase 7.G1; se bloquea ya porque fija `websockets<16` y ese
    # conflicto se resuelve una sola vez, en la 0.G1, con toda la suite por delante.
    "google-adk>=2.14,<3",
    "httpx>=0.28",
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    "llama-index-core>=0.14,<0.15",
    "strands-agents>=1.59,<2",
]

[tool.uv.sources]
headache-core = { workspace = true }
harness = { workspace = true }
retrieval = { workspace = true }
support-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_agent"]
