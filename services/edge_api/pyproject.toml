[project]
name = "edge-api"
version = "0.1.0"
description = "Puerta de entrada pública de Headache: admisión, rate limiting, caché y streaming"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "headache-core[postgres,redis]",
    "mcp-servers",
    "retrieval",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
headache-core = { workspace = true }
mcp-servers = { workspace = true }
retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_api"]
