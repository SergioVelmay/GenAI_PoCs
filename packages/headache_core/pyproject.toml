[project]
name = "headache-core"
version = "0.1.0"
description = "Dominio, casos de uso, puertos y adaptadores compartidos del caso Headache"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
retrieval = [
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
]
postgres = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pgvector>=0.4",
    "sqlalchemy[asyncio]>=2.0.36",
]
azure = [
    "azure-identity>=1.19",
    "azure-search-documents>=11.6",
    "azure-servicebus>=7.14",
    "azure-storage-blob>=12.24",
    "openai>=1.68",
]
aws = [
    "boto3>=1.38",
]
gateway = [
    "litellm>=1.70",
]
observability = [
    "langfuse>=3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
]
rabbitmq = [
    "aio-pika>=9.5",
]
tools = [
    "httpx>=0.27",
]
llamaindex = [
    "llama-index-core>=0.14",
    "llama-index-retrievers-bm25>=0.6",
    "llama-index-storage-docstore-postgres>=0.4",
    "llama-index-vector-stores-postgres>=0.7",
]
redis = [
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headache_core"]
