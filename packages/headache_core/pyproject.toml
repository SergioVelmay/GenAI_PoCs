[project]
name = "headache-core"
version = "0.1.0"
description = "Dominio, casos de uso, puertos y adaptadores compartidos del caso Headache"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
retrieval = [
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
]
postgres = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pgvector>=0.4",
    "sqlalchemy[asyncio]>=2.0.36",
]
azure = [
    "azure-identity>=1.19",
    "azure-search-documents>=11.6",
    "azure-servicebus>=7.14",
    "azure-storage-blob>=12.24",
    "openai>=1.68",
]
aws = [
    "boto3>=1.38",
]
# El módulo generativo de `vertexai` se retiró el 24-06-2026: Gemini se habla con `google-genai`
# y `google-cloud-aiplatform` queda para RAG Engine, Agent Runtime, evaluación y experimentos.
gcp = [
    "google-cloud-aiplatform>=2.7",
    "google-cloud-discoveryengine>=0.20",
    "google-cloud-dlp>=3.40",
    "google-cloud-modelarmor>=0.7",
    "google-cloud-monitoring>=2.32",
    "google-cloud-pubsub>=2.43",
    "google-cloud-storage>=3.17",
    # Hay 3.0, pero ADK 2.14 (sabor de la 7.G) exige `google-genai<3`: manda el techo del
    # framework para que las tres nubes y los seis sabores quepan en un solo lock.
    "google-genai>=2.34,<3",
]
gateway = [
    "litellm>=1.70",
]
observability = [
    "langfuse>=3.0",
]
rabbitmq = [
    "aio-pika>=9.5",
]
tools = [
    "httpx>=0.27",
]
llamaindex = [
    "llama-index-core>=0.14",
    "llama-index-retrievers-bm25>=0.6",
    "llama-index-storage-docstore-postgres>=0.4",
    "llama-index-vector-stores-postgres>=0.7",
]
redis = [
    "redis>=5.2",
]
telemetry = [
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-sdk>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headache_core"]
