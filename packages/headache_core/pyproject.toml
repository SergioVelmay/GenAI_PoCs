[project]
name = "headache-core"
version = "0.1.0"
description = "Dominio, casos de uso, puertos y adaptadores compartidos del caso Headache"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
postgres = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
]
azure = [
    "azure-identity>=1.19",
    "openai>=1.68",
]
aws = [
    "boto3>=1.38",
]
gateway = [
    "litellm>=1.70",
]
observability = [
    "langfuse>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headache_core"]
