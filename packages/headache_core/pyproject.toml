[project]
name = "headache-core"
version = "0.1.0"
description = "Dominio, casos de uso, puertos y adaptadores compartidos del caso Headache"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headache_core"]
