# Uso (desde la raíz del repo, con PostgreSQL levantado):
#   uv run alembic -c packages/headache_core/alembic.ini upgrade head
#   uv run alembic -c packages/headache_core/alembic.ini upgrade head --sql   # solo muestra el DDL
# La URL se lee de la configuración (POSTGRES__*), nunca de este fichero.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
