[project]
name = "harness"
version = "0.1.0"
description = "Agentic harness (fase 8): validación, autocorrección y guardrails para cualquier agente"
requires-python = ">=3.12"
dependencies = [
    "headache-core",
    "pydantic>=2.9",
    "sqlglot>=26",
]

[tool.uv.sources]
headache-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
