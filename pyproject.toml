[project]
name = "genai-pocs"
version = "0.1.0"
description = "PoCs de sistemas agénticos GenAI (caso Headache) en Azure y AWS"
requires-python = ">=3.12"
dependencies = [
    "headache-core[postgres,rabbitmq,llamaindex,azure,aws,gateway,observability]",
    "indexer",
    "ticketing-api",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
headache-core = { workspace = true }
indexer = { workspace = true }
ticketing-api = { workspace = true }

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "boto3-stubs[bedrock-runtime]>=1.38",
    "faker>=30.0",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["headache_core", "indexer", "ticketing_api"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/headache_core/src",
    "packages/headache_core/tests",
    "services/indexer/src",
    "services/indexer/tests",
    "services/ticketing_api/src",
    "services/ticketing_api/tests",
    "scripts",
]

# Las integraciones de LlamaIndex con PostgreSQL no publican tipos (sin py.typed).
[[tool.mypy.overrides]]
module = ["llama_index.vector_stores.*", "llama_index.storage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Los tests de integración necesitan PostgreSQL: uv run pytest -m integration
addopts = "--import-mode=importlib -m 'not integration'"
markers = ["integration: requiere docker compose up -d (PostgreSQL migrado y RabbitMQ)"]
