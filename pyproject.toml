[project]
name = "genai-pocs"
version = "0.1.0"
description = "PoCs de sistemas agénticos GenAI (caso Genaipocs) en Azure, AWS y GCP"
requires-python = ">=3.12"
dependencies = [
    "genaipocs-core[aws,azure,gateway,gcp,llamaindex,observability,postgres,rabbitmq,redis,retrieval,telemetry,tools]",
    "harness",
    "indexer",
    "ticketing-api",
    "retrieval",
    "rag-evals",
    "mcp-servers",
    "support-agent",
    "booking-agent",
    "orchestrator",
    "edge-api",
]

[tool.uv.workspace]
members = ["packages/*", "services/*", "evals"]

[tool.uv.sources]
genaipocs-core = { workspace = true }
harness = { workspace = true }
indexer = { workspace = true }
ticketing-api = { workspace = true }
retrieval = { workspace = true }
rag-evals = { workspace = true }
mcp-servers = { workspace = true }
support-agent = { workspace = true }
booking-agent = { workspace = true }
orchestrator = { workspace = true }
edge-api = { workspace = true }

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "boto3-stubs[bedrock-agent,bedrock-agent-runtime,bedrock-agentcore,bedrock-runtime,s3,s3vectors,sqs]>=1.38",
    "faker>=30.0",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
]
load = [
    "locust>=2.37",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "booking_agent",
    "edge_api",
    "harness",
    "genaipocs_core",
    "genaipocs_mcp",
    "indexer",
    "orchestrator",
    "rag_evals",
    "retrieval",
    "support_agent",
    "ticketing_api",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/genaipocs_core/src",
    "packages/genaipocs_core/tests",
    "packages/harness/src",
    "packages/harness/tests",
    "services/indexer/src",
    "services/indexer/tests",
    "services/ticketing_api/src",
    "services/ticketing_api/tests",
    "services/retrieval/src",
    "services/retrieval/tests",
    "services/mcp_servers/src",
    "services/mcp_servers/tests",
    "services/support_agent/src",
    "services/support_agent/tests",
    "services/booking_agent/src",
    "services/booking_agent/tests",
    "services/orchestrator/src",
    "services/orchestrator/tests",
    "services/edge_api/src",
    "services/edge_api/tests",
    "evals/src",
    "evals/tests",
    "scripts",
]

# Las integraciones de LlamaIndex con PostgreSQL no publican tipos (sin py.typed).
[[tool.mypy.overrides]]
module = ["llama_index.vector_stores.*", "llama_index.storage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

# La capa de alto nivel de Pub/Sub (`google.cloud.pubsub_v1`: lotes, streaming pull, emulador por
# PUBSUB_EMULATOR_HOST) no publica py.typed, pero su código sí está anotado: mypy lo analiza en
# lugar de tratarlo como Any (el cliente generado `google.pubsub_v1` sí publica py.typed).
[[tool.mypy.overrides]]
module = ["google.cloud.pubsub_v1", "google.cloud.pubsub_v1.*", "google.cloud.pubsub", "google.cloud.pubsub.*"]
follow_untyped_imports = true

# `agentplatform` (RAG Engine, 3.G3; viene con google-cloud-aiplatform) y `google-cloud-storage`
# no publican py.typed, pero su código está anotado: mypy lo analiza en lugar de tratarlo como Any.
[[tool.mypy.overrides]]
module = ["agentplatform", "agentplatform.*", "google.cloud.storage", "google.cloud.storage.*"]
follow_untyped_imports = true

# `grpcio` no publica tipos y sus stubs (`types-grpcio`) no están en el lock: el canal sin TLS del
# emulador de Pub/Sub (3.G1) es lo único que se usa de él.
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

# Extra opcional `evals`: puede no estar instalado (CI). Se tratan como Any en ambos casos
# para que mypy de el mismo resultado con y sin el extra.
[[tool.mypy.overrides]]
module = ["ragas", "ragas.*", "deepeval", "deepeval.*", "azure.ai.evaluation", "azure.ai.evaluation.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["rag_evals.frameworks.*"]
disallow_subclassing_any = false

# Extra opcional `pii` del harness: mismo tratamiento que `evals`.
[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Extras opcionales `redteam` (PyRIT, fase 12.4) y `llmops` (MLflow, 12.7): mismo tratamiento.
[[tool.mypy.overrides]]
module = ["pyrit", "pyrit.*", "mlflow", "mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["packages", "services", "evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Los tests de integración necesitan PostgreSQL: uv run pytest -m integration
# Con el extra `evals`, el plugin de pytest de DeepEval importa `deepeval`, que vuelca el `.env`
# en `os.environ` y rompe el aislamiento de los tests: se desactiva (no se usa).
addopts = "--import-mode=importlib -m 'not integration' -p no:deepeval"
markers = ["integration: requiere docker compose up -d (PostgreSQL migrado y RabbitMQ) y --profile scale (Redis)"]
# llama-index-workflows recorre el agente (modelo Pydantic) con inspect.getmembers y toca
# atributos deprecados: ruido de la librería, no de nuestro código. `agentplatform` (3.G3) declara
# un `model_validator` sobre un classmethod, deprecado en Pydantic 2.12: también es suyo.
filterwarnings = ["ignore::pydantic.warnings.PydanticDeprecatedSince20:inspect", "ignore::pydantic.warnings.PydanticDeprecatedSince211:inspect", "ignore::pydantic.warnings.PydanticDeprecatedSince212:agentplatform"]
