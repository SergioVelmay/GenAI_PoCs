[project]
name = "genai-pocs"
version = "0.1.0"
description = "PoCs de sistemas agénticos GenAI (caso Headache) en Azure y AWS"
requires-python = ">=3.12"
dependencies = [
    "headache-core[aws,azure,gateway,llamaindex,observability,postgres,rabbitmq,redis,retrieval,telemetry,tools]",
    "harness",
    "indexer",
    "ticketing-api",
    "retrieval",
    "rag-evals",
    "mcp-servers",
    "support-agent",
    "booking-agent",
    "orchestrator",
    "edge-api",
]

[tool.uv.workspace]
members = ["packages/*", "services/*", "evals"]

[tool.uv.sources]
headache-core = { workspace = true }
harness = { workspace = true }
indexer = { workspace = true }
ticketing-api = { workspace = true }
retrieval = { workspace = true }
rag-evals = { workspace = true }
mcp-servers = { workspace = true }
support-agent = { workspace = true }
booking-agent = { workspace = true }
orchestrator = { workspace = true }
edge-api = { workspace = true }

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "boto3-stubs[bedrock-agent,bedrock-agent-runtime,bedrock-agentcore,bedrock-runtime,s3,s3vectors,sqs]>=1.38",
    "faker>=30.0",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
]
load = [
    "locust>=2.37",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "booking_agent",
    "edge_api",
    "harness",
    "headache_core",
    "headache_mcp",
    "indexer",
    "orchestrator",
    "rag_evals",
    "retrieval",
    "support_agent",
    "ticketing_api",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/headache_core/src",
    "packages/headache_core/tests",
    "packages/harness/src",
    "packages/harness/tests",
    "services/indexer/src",
    "services/indexer/tests",
    "services/ticketing_api/src",
    "services/ticketing_api/tests",
    "services/retrieval/src",
    "services/retrieval/tests",
    "services/mcp_servers/src",
    "services/mcp_servers/tests",
    "services/support_agent/src",
    "services/support_agent/tests",
    "services/booking_agent/src",
    "services/booking_agent/tests",
    "services/orchestrator/src",
    "services/orchestrator/tests",
    "services/edge_api/src",
    "services/edge_api/tests",
    "evals/src",
    "evals/tests",
    "scripts",
]

# Las integraciones de LlamaIndex con PostgreSQL no publican tipos (sin py.typed).
[[tool.mypy.overrides]]
module = ["llama_index.vector_stores.*", "llama_index.storage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

# Extra opcional `evals`: puede no estar instalado (CI). Se tratan como Any en ambos casos
# para que mypy de el mismo resultado con y sin el extra.
[[tool.mypy.overrides]]
module = ["ragas", "ragas.*", "deepeval", "deepeval.*", "azure.ai.evaluation", "azure.ai.evaluation.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["rag_evals.frameworks.*"]
disallow_subclassing_any = false

# Extra opcional `pii` del harness: mismo tratamiento que `evals`.
[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Extras opcionales `redteam` (PyRIT, fase 12.4) y `llmops` (MLflow, 12.7): mismo tratamiento.
[[tool.mypy.overrides]]
module = ["pyrit", "pyrit.*", "mlflow", "mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["packages", "services", "evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Los tests de integración necesitan PostgreSQL: uv run pytest -m integration
# Con el extra `evals`, el plugin de pytest de DeepEval importa `deepeval`, que vuelca el `.env`
# en `os.environ` y rompe el aislamiento de los tests: se desactiva (no se usa).
addopts = "--import-mode=importlib -m 'not integration' -p no:deepeval"
markers = ["integration: requiere docker compose up -d (PostgreSQL migrado y RabbitMQ) y --profile scale (Redis)"]
# llama-index-workflows recorre el agente (modelo Pydantic) con inspect.getmembers y toca
# atributos deprecados: ruido de la librería, no de nuestro código.
filterwarnings = ["ignore::pydantic.warnings.PydanticDeprecatedSince20:inspect", "ignore::pydantic.warnings.PydanticDeprecatedSince211:inspect"]
